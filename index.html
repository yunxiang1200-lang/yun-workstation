<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄色的云 · 设计工作台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f2f5f9;
  --panel: #ffffff;
  --card: #ffffff;
  --border: #e8ecf1;
  --border-light: #f1f5f9;
  --text: #1e293b;
  --text-secondary: #475569;
  --dim: #94a3b8;
  --blue: #3b82f6;
  --blue-light: #60a5fa;
  --blue-dark: #2563eb;
  --blue-bg: #eff6ff;
  --blue-glow: rgba(59,130,246,0.12);
  --green: #10b981;
  --green-bg: #ecfdf5;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --orange: #f59e0b;
  --orange-bg: #fffbeb;
  --purple: #8b5cf6;
  --purple-bg: #f5f3ff;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 16px -2px rgba(0,0,0,0.06), 0 2px 8px -2px rgba(0,0,0,0.03);
  --shadow-lg: 0 12px 24px -4px rgba(0,0,0,0.06), 0 4px 12px -2px rgba(0,0,0,0.02);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Top Bar ── */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 24px; margin-bottom: 16px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.topbar-left { display: flex; align-items: baseline; gap: 16px; }
.topbar-left h1 {
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 0.5px;
}
.topbar-left .greeting { font-size: 13px; color: var(--dim); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 28px; }
.topbar-right .clock { font-size: 22px; font-weight: 600; letter-spacing: 1px; color: var(--text); }
.topbar-right .date { font-size: 13px; color: var(--dim); }
.topbar-right .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,0.4);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ── Main Layout: Sidebar + Content ── */
.main-layout {
  display: grid;
  grid-template-columns: 2fr 8fr;
  gap: 16px;
  height: calc(100vh - 100px);
}

/* ── Sidebar ── */
.sidebar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 0;
  display: flex; flex-direction: column; gap: 2px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.sidebar-header {
  padding: 8px 20px 16px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 2.5px;
  color: var(--dim); font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 20px;
  font-size: 14px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all .2s ease; border: none; background: none;
  width: 100%; text-align: left; font-family: inherit;
  position: relative; border-left: 3px solid transparent;
  border-radius: 0 8px 8px 0; margin-right: 8px;
}
.nav-item:hover {
  color: var(--blue); background: var(--blue-bg);
  transform: translateX(2px);
}
.nav-item.active {
  color: var(--blue); background: var(--blue-bg);
  border-left-color: var(--blue);
  box-shadow: inset 0 0 0 1px rgba(59,130,246,0.08);
}
.nav-icon {
  width: 32px; height: 32px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 14px; font-weight: 600; transition: all .2s ease;
}
.nav-icon.design { background: var(--blue-bg); color: var(--blue); }
.nav-icon.study { background: var(--purple-bg); color: var(--purple); }
.nav-icon.data { background: var(--green-bg); color: var(--green); }
.nav-icon.stock { background: var(--red-bg); color: var(--red); }
.nav-icon.biz { background: var(--orange-bg); color: var(--orange); }
.nav-item.active .nav-icon { transform: scale(1.05); }
.nav-badge {
  margin-left: auto; font-size: 11px; padding: 3px 10px;
  border-radius: 12px; background: var(--border-light);
  color: var(--dim); font-weight: 500;
}

.sidebar-footer {
  margin-top: auto; padding: 16px 20px 8px;
  border-top: 1px solid var(--border-light);
}
.sidebar-footer .ver { font-size: 10px; color: var(--dim); }

/* ── Content Area ── */
.content-area {
  overflow-y: auto; overflow-x: hidden;
  padding-right: 4px;
}
.content-area::-webkit-scrollbar { width: 5px; }
.content-area::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 3px;
}
.content-area::-webkit-scrollbar-track { background: transparent; }

/* ── Page Sections ── */
.page-section { display: none; height: 100%; }
.page-section.active {
  display: flex; flex-direction: column; gap: 16px;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow);
  transition: box-shadow .2s ease;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; flex-shrink: 0;
}
.card-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;
  color: var(--text);
}
.card-title .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-cyan { background: var(--blue); box-shadow: 0 0 8px rgba(59,130,246,0.3); }
.dot-green { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.3); }
.dot-orange { background: var(--orange); box-shadow: 0 0 8px rgba(245,158,11,0.3); }
.dot-purple { background: var(--purple); box-shadow: 0 0 8px rgba(139,92,246,0.3); }
.dot-red { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.3); }
.card-badge {
  font-size: 12px; padding: 4px 12px; border-radius: 20px;
  background: var(--border-light); color: var(--dim); font-weight: 500;
}
.card-body { flex: 1; min-height: 0; overflow-y: auto; }
.card-body::-webkit-scrollbar { width: 4px; }
.card-body::-webkit-scrollbar-track { background: transparent; }
.card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.section-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--dim); margin: 16px 0 10px; font-weight: 700;
}
.section-label:first-child { margin-top: 0; }

/* ── Inner column layouts ── */
.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

/* ── Project Items ── */
.project-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border-light);
}
.project-item:last-child { border-bottom: none; }
.project-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; color: var(--text); }
.project-meta { font-size: 11px; color: var(--dim); }
.project-status { font-size: 11px; color: var(--dim); text-align: right; }
.progress-bar {
  height: 6px; background: var(--border-light); border-radius: 3px;
  margin-top: 8px; width: 100%; overflow: hidden;
}
.progress-fill { height: 100%; border-radius: 3px; transition: width .3s ease; }
.progress-cyan {
  background: linear-gradient(90deg, var(--blue) 0%, var(--blue-light) 100%);
}
.progress-purple {
  background: linear-gradient(90deg, var(--purple) 0%, #a78bfa 100%);
}

.todo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; font-size: 13px; color: var(--text-secondary);
}
.todo-item .check {
  width: 18px; height: 18px; border-radius: 6px;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: all .2s ease;
}
.todo-item .check:hover { border-color: var(--blue); }
.todo-date { font-size: 11px; color: var(--orange); margin-left: auto; font-weight: 500; }

.quick-actions { display: flex; gap: 8px; margin-top: 16px; }
.quick-btn {
  padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 500;
  border: 1.5px solid var(--border); background: var(--panel);
  color: var(--text-secondary); cursor: pointer; transition: all .2s ease;
  font-family: inherit;
}
.quick-btn:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-bg); transform: translateY(-1px);
}

/* ── Study ── */
.progress-ring-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
.progress-ring {
  width: 64px; height: 64px; border-radius: 50%;
  background: conic-gradient(var(--blue) 0deg 240deg, var(--border-light) 240deg 360deg);
  display: flex; align-items: center; justify-content: center;
}
.progress-ring-inner {
  width: 50px; height: 50px; border-radius: 50%; background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--text);
}
.progress-info .pct { font-size: 20px; font-weight: 700; color: var(--blue); }
.progress-info .sub { font-size: 12px; color: var(--dim); }
.study-task {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  font-size: 13px; color: var(--text-secondary);
}
.study-task .tag {
  font-size: 10px; padding: 3px 10px; border-radius: 10px; flex-shrink: 0;
  font-weight: 600;
}
.tag-book { background: var(--blue-bg); color: var(--blue); }
.tag-course { background: var(--purple-bg); color: var(--purple); }
.tag-research { background: var(--green-bg); color: var(--green); }
.study-duration { font-size: 11px; color: var(--dim); margin-left: auto; font-weight: 500; }
.knowledge-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.knowledge-tag {
  font-size: 12px; padding: 6px 16px; border-radius: 10px;
  background: var(--border-light); color: var(--text-secondary);
  border: 1.5px solid transparent; cursor: pointer; transition: all .2s ease;
  font-weight: 500;
}
.knowledge-tag:hover {
  border-color: var(--blue); color: var(--blue);
  background: var(--blue-bg); transform: translateY(-1px);
}

/* ── Data Summary ── */
.index-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.index-item {
  background: var(--border-light); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 20px; text-align: center;
  transition: all .2s ease;
}
.index-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.index-name { font-size: 11px; color: var(--dim); letter-spacing: 1px; font-weight: 600; }
.index-value { font-size: 24px; font-weight: 700; margin: 8px 0 4px; color: var(--text); }
.index-change { font-size: 13px; font-weight: 600; }
.up { color: var(--green); }
.down { color: var(--red); }
.watch-list { margin-top: 16px; }
.watch-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
}
.watch-item:last-child { border-bottom: none; }
.watch-name { font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.watch-price { font-size: 15px; font-weight: 600; color: var(--text); }
.watch-signal { font-size: 11px; padding: 4px 12px; border-radius: 12px; font-weight: 600; }
.signal-buy { background: var(--red-bg); color: var(--red); }
.signal-hold { background: var(--orange-bg); color: var(--orange); }
.signal-watch { background: var(--blue-bg); color: var(--blue); }

/* ── Stock Panel ── */
.tab-bar {
  display: flex; gap: 4px; margin-bottom: 20px;
  background: var(--border-light); border-radius: 12px; padding: 4px;
}
.tab-btn {
  flex: 1; padding: 10px 0; text-align: center; font-size: 13px;
  font-weight: 500; border: none; background: transparent; color: var(--dim);
  border-radius: 10px; cursor: pointer; transition: all .2s ease; font-family: inherit;
}
.tab-btn:hover { color: var(--blue); }
.tab-btn.active {
  background: var(--blue); color: #fff; font-weight: 600;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}
.tab-content { display: none; animation: fadeIn .2s ease; }
.tab-content.active { display: block; }

.pnl-row { display: flex; justify-content: space-around; margin-bottom: 18px; }
.pnl-item { text-align: center; }
.pnl-label { font-size: 11px; color: var(--dim); font-weight: 600; }
.pnl-value { font-size: 22px; font-weight: 700; margin-top: 4px; color: var(--text); }
.pnl-value.up { color: var(--green); }
.pnl-value.down { color: var(--red); }

.holdings-list { margin-top: 12px; }
.holding-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
}
.holding-row:last-child { border-bottom: none; }
.holding-name { font-size: 14px; font-weight: 600; color: var(--text); }
.holding-info { font-size: 13px; color: var(--dim); text-align: right; }
.holding-pnl { font-size: 14px; font-weight: 700; min-width: 70px; text-align: right; color: var(--text); }

.analysis-row { display: flex; gap: 12px; margin-bottom: 16px; }
.analysis-chip {
  flex: 1; padding: 16px; text-align: center; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600;
  background: var(--border-light); border: 2px solid var(--border);
  transition: all .2s ease;
}
.analysis-chip:hover { transform: translateY(-1px); }
.chip-bullish { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.chip-neutral { border-color: var(--orange); color: var(--orange); background: var(--orange-bg); }
.chip-bearish { border-color: var(--green); color: var(--green); background: var(--green-bg); }

.t-tips { font-size: 14px; line-height: 2; }
.t-tip-row { display: flex; justify-content: space-between; padding: 7px 0; }
.t-tip-label { color: var(--dim); }
.t-tip-value { font-weight: 700; color: var(--text); }

.strategy-box {
  background: var(--blue-bg); border: 1.5px solid rgba(59,130,246,0.2);
  border-radius: var(--radius-sm); padding: 16px 20px; margin-top: 14px;
  font-size: 13px; color: var(--text-secondary); line-height: 1.9;
}
.strategy-box strong { color: var(--blue); }

/* ── Side Business ── */
.income-row { display: flex; gap: 16px; margin-bottom: 20px; }
.income-card {
  flex: 1; background: var(--border-light); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 18px; text-align: center;
  transition: all .2s ease;
}
.income-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.income-label { font-size: 11px; color: var(--dim); font-weight: 600; }
.income-value { font-size: 24px; font-weight: 700; margin-top: 8px; color: var(--text); }

.idea-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
}
.idea-item:last-child { border-bottom: none; }
.idea-stars { color: var(--orange); font-size: 14px; letter-spacing: 1px; }
.idea-name { font-size: 14px; flex: 1; color: var(--text-secondary); }
.idea-feasibility { font-size: 11px; padding: 4px 12px; border-radius: 12px; font-weight: 600; }
.feas-high { background: var(--green-bg); color: var(--green); }
.feas-mid { background: var(--orange-bg); color: var(--orange); }
.action-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; font-size: 13px; color: var(--text-secondary);
}

/* ── Mini chart placeholders ── */
.mini-chart {
  height: 60px; background: var(--border-light);
  border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--dim); margin-top: 10px;
}

/* ── Summary cards in data page ── */
.summary-card {
  background: var(--border-light); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 18px 20px; cursor: default;
  transition: all .2s ease;
}
.summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.summary-card .section-label { cursor: pointer; transition: color .2s; }
.summary-card .section-label:hover { color: var(--blue); }
.summary-stats { font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
.s-num { font-size: 17px; font-weight: 700; color: var(--text); }

.divider {
  height: 1px; background: var(--border-light); margin: 8px 0;
}

/* ── Mobile Bottom Nav ── */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--panel); border-top: 1px solid var(--border);
  padding: 6px 0 env(safe-area-inset-bottom, 6px);
}
.mobile-nav .mnav-inner {
  display: flex; justify-content: space-around;
}
.mobile-nav button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; padding: 6px 4px;
  font-size: 10px; color: var(--dim); font-family: inherit;
  cursor: pointer; transition: color .2s; min-width: 50px;
}
.mobile-nav button .mn-icon {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.mobile-nav button.active { color: var(--blue); }
.mobile-nav button.active .mn-icon { background: var(--blue-bg); }

/* ── Responsive ── */

/* Tablet: 900 - 1100 */
@media (max-width: 1100px) and (min-width: 769px) {
  .main-layout { grid-template-columns: 72px 1fr; gap: 12px; }
  .sidebar { padding: 12px 0; }
  .sidebar-header { display: none; }
  .nav-item { padding: 14px 0; justify-content: center; border-left: none; border-bottom: 3px solid transparent; border-radius: 0; margin-right: 0; text-align: center; }
  .nav-item span:not(.nav-icon) { display: none; }
  .nav-item .nav-badge { margin: 0; font-size: 9px; padding: 2px 6px; }
  .nav-item.active { border-left-color: transparent; border-bottom-color: var(--blue); }
  .nav-item:hover { transform: none; }
  .sidebar-footer .ver { font-size: 8px; text-align: center; }
  .cols-2 { grid-template-columns: 1fr 1fr; }
  .cols-3 { grid-template-columns: 1fr 1fr; }
  .index-row { grid-template-columns: repeat(2, 1fr); }
  .income-row { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .topbar { padding: 12px 18px; }
  .topbar-left h1 { font-size: 18px; }
  .topbar-left .greeting { display: none; }
  .card { padding: 18px 20px; }
}

/* Phone: under 768 */
@media (max-width: 768px) {
  body { padding: 12px; overflow: auto; }
  .topbar { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 10px; }
  .topbar-left h1 { font-size: 16px; }
  .topbar-left .greeting { display: none; }
  .topbar-right .clock { font-size: 16px; letter-spacing: 0.5px; }
  .topbar-right .date { display: none; }
  .topbar-right .pulse { display: none; }
  .logout-btn { padding: 4px 10px; font-size: 11px; }

  .main-layout {
    grid-template-columns: 1fr;
    height: auto;
    margin-bottom: 70px;
  }
  .sidebar { display: none; }
  .mobile-nav { display: block; }

  .content-area { overflow: visible; }
  .page-section.active { gap: 10px; }
  .section-label { font-size: 10px; letter-spacing: 1.5px; }

  .card { padding: 16px 16px; border-radius: var(--radius-sm); }
  .card-header { margin-bottom: 12px; }
  .card-title { font-size: 14px; }
  .card-badge { font-size: 10px; padding: 3px 8px; }

  .cols-2, .cols-3 { grid-template-columns: 1fr; gap: 12px; }
  .index-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .index-item { padding: 14px 10px; }
  .index-name { font-size: 10px; }
  .index-value { font-size: 18px; }
  .index-change { font-size: 11px; }

  .income-row { flex-direction: column; gap: 8px; }
  .income-card { padding: 14px; }
  .income-value { font-size: 20px; }

  .summary-card { padding: 14px 16px; }
  .pnl-value { font-size: 18px; }
  .analysis-row { gap: 6px; }
  .analysis-chip { padding: 12px 8px; font-size: 12px; }

  .tab-bar { margin-bottom: 12px; }
  .tab-btn { font-size: 11px; padding: 8px 0; }

  .project-item, .holding-row, .watch-item { padding: 8px 0; }
  .project-name { font-size: 13px; }
  .holding-name { font-size: 13px; }

  .study-task { font-size: 12px; }
  .knowledge-tags { gap: 6px; }
  .knowledge-tag { font-size: 11px; padding: 5px 12px; }

  .login-card { padding: 32px 24px; }
  .login-card h2 { font-size: 18px; }
  .login-card .login-icon { width: 44px; height: 44px; border-radius: 12px; font-size: 20px; }
  .login-field input { padding: 11px 14px; font-size: 14px; }
  .login-btn { padding: 12px; font-size: 15px; }
}

/* Small phone: under 400 */
@media (max-width: 400px) {
  body { padding: 8px; }
  .topbar { padding: 8px 12px; }
  .topbar-left h1 { font-size: 14px; }
  .topbar-right .clock { font-size: 14px; }
  .card { padding: 12px; }
  .card-header { margin-bottom: 10px; }
  .card-title { font-size: 13px; }
  .index-item { padding: 10px 6px; }
  .index-value { font-size: 16px; }
  .login-card { padding: 24px 18px; border-radius: 18px; }
  .login-card h2 { font-size: 16px; }
  .login-card .login-icon { width: 38px; height: 38px; border-radius: 10px; font-size: 18px; margin-bottom: 14px; }
  .login-field input { padding: 10px 12px; font-size: 13px; }
  .login-btn { padding: 11px; font-size: 14px; }
}

/* Large screens: over 1400 */
@media (min-width: 1400px) {
  .main-layout { grid-template-columns: 240px 1fr; }
  body { padding: 28px 40px; }
  .cols-2 { gap: 24px; }
  .cols-3 { gap: 24px; }
  .card { padding: 28px 32px; }
}

/* ── Login Overlay ── */
.login-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.login-overlay.hidden { display: none; }

.login-bg-particles {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.login-bg-particle {
  position: absolute; border-radius: 50%;
  background: rgba(59,130,246,0.15);
  animation: floatUp 6s infinite ease-in;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.login-card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px; padding: 48px 40px;
  width: 420px; max-width: 90vw;
  text-align: center;
}
.login-card .login-icon {
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff; font-weight: 700;
  box-shadow: 0 8px 32px rgba(59,130,246,0.3);
}
.login-card h2 {
  font-size: 22px; font-weight: 700; color: #f1f5f9;
  margin-bottom: 6px; letter-spacing: 1px;
}
.login-card .login-sub {
  font-size: 13px; color: #64748b; margin-bottom: 32px;
}

.login-field {
  margin-bottom: 18px; text-align: left;
}
.login-field label {
  display: block; font-size: 12px; color: #94a3b8;
  margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px;
}
.login-field input {
  width: 100%; padding: 13px 16px; border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  color: #f1f5f9; font-size: 15px;
  font-family: inherit; outline: none;
  transition: all .25s ease;
}
.login-field input:focus {
  border-color: var(--blue);
  background: rgba(59,130,246,0.08);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
.login-field input::placeholder { color: #475569; }

.login-btn {
  width: 100%; padding: 14px; border-radius: 12px;
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
  border: none; color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; letter-spacing: 1px;
  margin-top: 8px; font-family: inherit;
  transition: all .25s ease;
  box-shadow: 0 4px 16px rgba(59,130,246,0.25);
}
.login-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(59,130,246,0.35);
}
.login-btn:active { transform: translateY(0); }

.login-error {
  font-size: 12px; color: var(--red); margin-top: 12px;
  min-height: 18px; transition: all .2s ease;
}

.login-remember {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: #64748b; margin-bottom: 4px;
}

/* ── Logout Button ── */
.logout-btn {
  padding: 6px 16px; border-radius: 10px;
  font-size: 12px; font-weight: 500; color: var(--dim);
  background: var(--border-light); border: 1px solid var(--border);
  cursor: pointer; font-family: inherit;
  transition: all .2s ease;
}
.logout-btn:hover { color: var(--red); border-color: var(--red); background: var(--red-bg); }

/* ── Biz Page ── */
.biz-tab-content { display: none; }
.biz-tab-content.active { display: block; animation: fadeIn .2s ease; }
.biz-news-list { max-height: 380px; overflow-y: auto; }
.biz-news-list::-webkit-scrollbar { width: 4px; }
.biz-news-list::-webkit-scrollbar-track { background: transparent; }
.biz-news-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.biz-news-item {
  padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
  border-left: 3px solid var(--blue); background: var(--blue-bg);
  transition: all .15s ease;
}
.biz-news-item:hover { transform: translateX(2px); }
.biz-news-item.read {
  border-left-color: var(--dim); background: var(--border-light); opacity: 0.65;
}
.biz-news-item.read .news-link { color: var(--dim); }
.biz-news-item.read .news-link:hover { color: var(--text-secondary); }
.biz-news-item .news-tag {
  display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px;
  margin-right: 6px; font-weight: 600; vertical-align: middle;
}
.news-tag-platform { background: var(--purple-bg); color: var(--purple); }
.news-tag-skill { background: var(--blue-bg); color: var(--blue); }
.news-tag-income { background: var(--green-bg); color: var(--green); }
.news-tag-trend { background: var(--orange-bg); color: var(--orange); }
.news-tag-order { background: var(--red-bg); color: var(--red); }
.news-link {
  font-size: 13px; color: var(--text-secondary); text-decoration: none;
  display: block; line-height: 1.6; transition: color .15s ease;
  word-break: break-all;
}
.news-link:hover { color: var(--blue); text-decoration: underline; }
.news-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 6px; font-size: 11px; color: var(--dim);
}
.news-date { white-space: nowrap; }
.news-actions { display: flex; gap: 6px; }
.news-action-btn {
  font-size: 10px; padding: 2px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--dim); cursor: pointer; font-family: inherit;
  transition: all .15s ease; white-space: nowrap;
}
.news-action-btn:hover { border-color: var(--blue); color: var(--blue); }
.news-action-btn.bookmarked { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
.news-filter-bar {
  display: flex; gap: 4px; margin-bottom: 10px; align-items: center;
}
.news-filter-btn {
  font-size: 11px; padding: 4px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--panel); color: var(--dim); cursor: pointer; font-family: inherit;
  transition: all .15s ease;
}
.news-filter-btn:hover { color: var(--blue); border-color: var(--blue); }
.news-filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.news-count { font-size: 11px; color: var(--dim); margin-left: auto; }
.order-progress-item { padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.order-progress-item:last-child { border-bottom: none; }

/* ── Empty state & add button ── */
.empty-state {
  padding: 24px 16px; text-align: center; color: var(--dim);
  font-size: 13px; border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm); background: var(--border-light);
}
.add-btn {
  padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--blue); background: var(--blue-bg); color: var(--blue);
  cursor: pointer; font-family: inherit; transition: all .2s ease;
}
.add-btn:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }

.item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
}
.item-row:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.item-sub { font-size: 11px; color: var(--dim); }
.item-actions { display: flex; gap: 6px; margin-left: 10px; flex-shrink: 0; }
.mini-btn {
  font-size: 11px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--dim); cursor: pointer; font-family: inherit;
  transition: all .15s ease; white-space: nowrap;
}
.mini-btn:hover { border-color: var(--blue); color: var(--blue); }
.mini-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 10000; background: rgba(15,23,42,0.5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal {
  width: 420px; max-width: 100%; background: var(--panel);
  border-radius: 18px; box-shadow: var(--shadow-lg); overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-header span { font-size: 15px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--dim); cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 18px 20px; max-height: 62vh; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.modal-save {
  padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: none; background: var(--blue); color: #fff; cursor: pointer; font-family: inherit;
}
.modal-save:hover { background: var(--blue-dark); }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
  font-size: 13px; color: var(--text); font-family: inherit; outline: none; background: var(--panel);
  transition: border-color .2s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--blue); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Economics plan ── */
.econ-hero { text-align: center; margin-bottom: 20px; }
.econ-hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.econ-hero .sub { font-size: 13px; color: var(--dim); }
.econ-resource {
  padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 14px;
  background: var(--blue-bg); border: 1.5px solid rgba(59,130,246,0.18); font-size: 13px; line-height: 1.9;
}
.econ-resource a { color: var(--red); font-weight: 700; }
.econ-phase { margin-bottom: 18px; }
.econ-phase-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
.econ-days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.econ-day {
  display: block; padding: 10px 6px; text-align: center; border-radius: 8px;
  background: var(--border-light); color: var(--text-secondary); text-decoration: none;
  font-size: 13px; font-weight: 600; border: 1.5px solid transparent; transition: all .2s ease;
}
.econ-day:hover { background: var(--blue); color: #fff; transform: translateY(-2px); }
@media (max-width: 768px) { .econ-days { grid-template-columns: repeat(3, 1fr); } }

.econ-day { cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; }
.econ-day.done { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.econ-day.done:hover { background: var(--green); color: #fff; }
.econ-day.current { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

.study-progress { margin: 12px auto 0; max-width: 460px; }
.study-progress-label { font-size: 12px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
.study-progress-bar { height: 8px; background: var(--border-light); border-radius: 6px; overflow: hidden; }
.study-progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue) 0%, var(--blue-light) 100%); border-radius: 6px; transition: width .3s ease; }

.study-detail { margin-top: 20px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px 22px; background: var(--panel); }
.study-detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.study-detail-title { font-size: 17px; font-weight: 700; line-height: 1.5; color: var(--text); flex: 1; }
.study-detail-actions { display: flex; gap: 6px; flex-shrink: 0; }
.study-sections { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; padding: 12px 14px; background: var(--border-light); border-radius: 10px; }
.study-section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.ss-tag { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 8px; flex-shrink: 0; }
.ss-tag.am { background: var(--blue-bg); color: var(--blue); }
.ss-tag.pm { background: var(--purple-bg); color: var(--purple); }
.ss-tag.quiz { background: var(--orange-bg); color: var(--orange); }

.study-detail-content { font-size: 14px; line-height: 1.9; color: var(--text-secondary); }
.study-detail-content h1 { font-size: 20px; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 8px; margin: 24px 0 14px; }
.study-detail-content h2 { font-size: 17px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 22px 0 12px; }
.study-detail-content h3 { font-size: 15px; color: var(--blue-dark); margin: 18px 0 10px; }
.study-detail-content h4 { font-size: 14px; color: var(--purple); margin: 14px 0 8px; }
.study-detail-content p { margin: 10px 0; }
.study-detail-content ul, .study-detail-content ol { margin: 10px 0; padding-left: 24px; }
.study-detail-content li { margin: 4px 0; }
.study-detail-content blockquote { background: var(--blue-bg); border-left: 3px solid var(--blue); padding: 10px 14px; margin: 12px 0; border-radius: 0 8px 8px 0; color: var(--text-secondary); }
.study-detail-content pre { background: #1e293b; color: #cbd5e1; padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; font-size: 13px; line-height: 1.6; }
.study-detail-content code { background: var(--border-light); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 13px; color: var(--red); }
.study-detail-content pre code { background: none; padding: 0; color: #cbd5e1; }
.study-detail-content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
.study-detail-content th, .study-detail-content td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
.study-detail-content th { background: var(--border-light); color: var(--text); }
.study-detail-content b, .study-detail-content strong { color: var(--red); }
.study-detail-content a { color: var(--blue); }
.study-detail-content .structure-node { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; background: var(--panel); }
.study-detail-content .structure-head { width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 11px 14px; background: var(--border-light); border: 0; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text); text-align: left; font-family: inherit; transition: background .15s ease; }
.study-detail-content .structure-head:hover { background: var(--blue-bg); }
.study-detail-content .structure-title { flex: 0 1 auto; }
.study-detail-content .structure-toggle { flex: none; margin-left: auto; font-size: 12px; font-weight: 600; color: var(--blue); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; }
.study-detail-content .structure-body { display: none; padding: 12px 14px; border-top: 1px solid var(--border); }
.study-detail-content .structure-node.open .structure-body { display: block; }
.study-detail-content .structure-node.open .structure-toggle { color: var(--red); }
.study-detail-content .structure-play { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--blue); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; user-select: none; white-space: nowrap; transition: all .15s ease; }
.study-detail-content .structure-play:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
.study-detail-content .structure-play.playing { background: var(--red); color: #fff; border-color: var(--red); }
.study-detail-content .structure-play.paused { background: var(--orange); color: #fff; border-color: var(--orange); }
.study-detail-content .structure-play.structure-replay { display: none; }
.study-detail-content .structure-play.structure-replay.show { display: inline-flex; }
.study-detail-content .tts-highlight { background: #bfdbfe; border-radius: 4px; }
.study-detail-content .tts-seg.tts-highlight { box-decoration-break: clone; padding: 1px 3px; }

.study-crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 14px; color: var(--dim); flex-wrap: wrap; }
.crumb-link { color: var(--blue); text-decoration: none; cursor: pointer; font-weight: 600; }
.crumb-link:hover { text-decoration: underline; }
.crumb-sep { color: var(--dim); }
.crumb-current { color: var(--text); font-weight: 600; }

.study-detail-page { margin-top: 0; }
.study-tabs { display: flex; gap: 4px; margin: 16px 0 12px; background: var(--border-light); border-radius: 10px; padding: 4px; }
.study-tab { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--dim); border-radius: 8px; cursor: pointer; font-family: inherit; transition: all .2s ease; }
.study-tab:hover { color: var(--blue); }
.study-tab.active { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.25); }
.study-tab-panels { margin-bottom: 16px; }
.study-tab-panel { display: none; }
.study-tab-panel.active { display: block; animation: fadeIn .2s ease; }
.study-panel-title { font-size: 15px; font-weight: 700; color: var(--text); padding: 10px 12px; background: var(--border-light); border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
.study-videos { margin-top: 16px; }
.study-videos-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.video-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
.video-frame { position: relative; padding-top: 56.25%; background: #0f172a; }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-link { display: block; padding: 8px 12px; font-size: 12px; color: var(--blue); text-decoration: none; font-weight: 600; }
.video-link:hover { text-decoration: underline; }
.study-source { margin-top: 14px; padding: 12px 14px; background: var(--border-light); border-radius: 10px; font-size: 12px; color: var(--dim); line-height: 1.7; display: flex; gap: 8px; align-items: flex-start; }

/* ── Study phase steps ── */
.study-steps { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; background: var(--border-light); border-radius: 12px; padding: 6px; }
.study-step { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: none; background: transparent; border-radius: 10px; cursor: pointer; font-family: inherit; transition: all .2s ease; color: var(--dim); font-weight: 600; font-size: 13px; }
.study-step:hover { color: var(--blue); }
.study-step.active { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.25); }
.study-step-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--border); color: var(--dim); font-size: 11px; font-weight: 700; }
.study-step.active .study-step-num { background: rgba(255,255,255,0.25); color: #fff; }
.study-phase-panel { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--panel); }
.study-phase-head { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.study-phase-range { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 8px; }
.study-day-list { display: flex; flex-direction: column; gap: 8px; }
.study-day-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-family: inherit; text-align: left; transition: all .15s ease; }
.study-day-item:hover { border-color: var(--blue); background: var(--blue-bg); transform: translateX(2px); }

function doLogin() {
  var email = document.getElementById('loginEmail').value.trim()
  var password = document.getElementById('loginPassword').value
  var errorEl = document.getElementById('loginError')

  if (!email) { errorEl.textContent = '请输入邮箱地址'; return }
  if (!password) { errorEl.textContent = '请输入密码'; return }
  if (email !== LOGIN_EMAIL || password !== LOGIN_PWD) {
    errorEl.textContent = '邮箱或密码错误，请重试'
    return
  }

  errorEl.textContent = ''
  if (document.getElementById('loginRemember').checked) {
    localStorage.setItem('yun_desk_login', '1')
  }

  document.getElementById('loginOverlay').classList.add('hidden')
  document.body.style.overflow = 'auto'
}

function doLogout() {
  localStorage.removeItem('yun_desk_login')
  document.getElementById('loginOverlay').classList.remove('hidden')
  document.body.style.overflow = 'hidden'
  document.getElementById('loginEmail').value = ''
  document.getElementById('loginPassword').value = ''
  document.getElementById('loginError').textContent = ''
}

if (localStorage.getItem('yun_desk_login') === '1') {
  document.getElementById('loginOverlay').classList.add('hidden')
  document.body.style.overflow = 'auto'
}

    p.style.width = size + 'px'
    p.style.height = size + 'px'
    p.style.left = Math.random() * 100 + '%'

    container.appendChild(p)
  }
})();

document.querySelector('#mobileNav button').classList.add('active')

document.getElementById('loginEmail').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus()
})
document.getElementById('loginPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin()
})

function updateClock() {
  var now = new Date()
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0')

  var days = ['日','一','二','三','四','五','六']
  document.getElementById('date').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + days[now.getDay()]

  var h = now.getHours()
  var g = document.getElementById('greeting')
  if (h < 6) g.textContent = '夜深了'
  else if (h < 9) g.textContent = '早上好'
  else if (h < 12) g.textContent = '上午好'
  else if (h < 14) g.textContent = '中午好'
  else if (h < 18) g.textContent = '下午好'
  else g.textContent = '晚上好'
}
updateClock()
setInterval(updateClock, 1000)

function shuffle(arr) {
  var a = arr.slice()
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1))
    var t = a[i]; a[i] = a[j]; a[j] = t
  }
  return a
}

var DATA_KEY = 'yun_desk_data_v2'

function defaultData() {
  return {
    design: { projects: [], todos: [] },
    stock: { holdings: [], watch: [] },
    biz: { income: { month: 0, goal: 0, total: 0 }, news: [], orders: [], projects: [] },
    study: { done: {}, quiz: {} }
  }
}

function loadData() {
  try {
    var raw = localStorage.getItem(DATA_KEY)
    if (raw) return JSON.parse(raw)
  } catch (e) {}
  return defaultData()
}

function mergeData(stored) {
  var def = defaultData()
  var out = stored || {}
  for (var section in def) {
    if (!out[section]) {
      out[section] = def[section]
    } else {
      for (var key in def[section]) {
        if (out[section][key] === undefined) out[section][key] = def[section][key]
      }
    }
  }
  return out
}

var DATA = mergeData(loadData())

function saveData() {
  try { localStorage.setItem(DATA_KEY, JSON.stringify(DATA)) } catch (e) {}
}

function uid() {
  return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function openAddModal(type) {
  var values = {}
  if (type === 'biz.income') values = DATA.biz.income || {}

  document.getElementById('modalTitle').textContent = (type === 'biz.income' ? '编辑 · ' : '添加 · ') + (MODAL_TITLES[type] || '')
  document.getElementById('modalBody').innerHTML = buildForm(type, values)
  document.getElementById('modalOverlay').classList.remove('hidden')
}

function openEditModal(type, id) {
  CURRENT_MODAL = { type: type, id: id }
  document.getElementById('modalTitle').textContent = '编辑 · ' + (MODAL_TITLES[type] || '')
  document.getElementById('modalBody').innerHTML = buildForm(type, findItem(type, id) || {})
  document.getElementById('modalOverlay').classList.remove('hidden')
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden')
  CURRENT_MODAL = null
}

function buildForm(type, values) {
  var fields = MODAL_FIELDS[type] || []
  var html = ''
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i]
    var val = values[f.key]
    if (val === undefined || val === null) val = ''
    html += '<div class="form-field"><label>' + f.label + '</label>'
    if (f.type === 'select') {
      html += '<select data-key="' + f.key + '">'
      for (var j = 0; j < f.options.length; j++) {
        var o = f.options[j]
        html += '<option value="' + o.v + '"' + (String(val) === String(o.v) ? ' selected' : '') + '>' + o.t + '</option>'
      }
      html += '</select>'
    } else if (f.type === 'number') {
      html += '<input type="number" data-key="' + f.key + '" value="' + escapeHtml(val) + '">'
    } else {
      html += '<input type="text" data-key="' + f.key + '" value="' + escapeHtml(val) + '">'
    }
    html += '</div>'
  }
  return html
}

function submitModal() {
  if (!CURRENT_MODAL) return
  var type = CURRENT_MODAL.type
  var fields = MODAL_FIELDS[type] || []
  var values = {}
  var inputs = document.querySelectorAll('#modalBody [data-key]')
  for (var i = 0; i < inputs.length; i++) {
    values[inputs[i].getAttribute('data-key')] = inputs[i].value
  }
  for (var k = 0; k < fields.length; k++) {
    var f = fields[k]
    if (f.type === 'number') values[f.key] = parseFloat(values[f.key]) || 0
  }

  if (type === 'biz.income') {
    for (var key in values) DATA.biz.income[key] = values[key]
    saveData()
    renderAll()
    closeModal()
    return
  }

  var list = getList(type)
  if (CURRENT_MODAL.id) {
    var item = findItem(type, CURRENT_MODAL.id)
    if (item) {
      for (var key2 in values) item[key2] = values[key2]
    }
  } else {
    if (!list) {
      list = []
      setList(type, list)
    }
    values.id = uid()
    list.push(values)
  }

  saveData()
  renderAll()
  closeModal()
}

function getList(type) {
  var parts = type.split('.')
  if (parts[0] === 'design') return DATA.design[parts[1]]
  if (parts[0] === 'stock') return DATA.stock[parts[1]]
  if (parts[0] === 'biz') return DATA.biz[parts[1]]
  return null
}

function setList(type, arr) {
  var parts = type.split('.')
  if (parts[0] === 'design') DATA.design[parts[1]] = arr
  if (parts[0] === 'stock') DATA.stock[parts[1]] = arr
  if (parts[0] === 'biz') DATA.biz[parts[1]] = arr
  return arr
}

function findItem(type, id) {
  var list = getList(type) || []
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) return list[i]
  }
  return null
}

function deleteItem(type, id) {
  var list = getList(type)
  if (!list) return
  var idx = -1
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { idx = i; break }
  }
  if (idx >= 0) list.splice(idx, 1)
  saveData()
  renderAll()
}

  var navs = document.querySelectorAll('.nav-item, .mobile-nav button')
  for (var j = 0; j < navs.length; j++) {
    navs[j].classList.toggle('active', navs[j].getAttribute('data-page') === name)
  }
  var content = document.querySelector('.content-area')
  if (content) content.scrollTop = 0
}

  fetch('study/' + phase.folder + '/第' + day + '天.html')

  if (day % 2 === 0) {

    html += '<div class="study-source"><span class="ss-tag pm">提示</span><span>马克思主义基本原理与习近平新时代中国特色社会主义思想概论建议结合全国自考指定教材与主流慕课课程学习，本平台暂未收录对应B站视频链接。</span></div>'
    html += '</div>'

    html += '<div class="video-grid">'
    html += '<div class="video-card"><div class="video-frame"><iframe src="https://player.bilibili.com/player.html?bvid=BV1uhLb6zEeT&amp;page=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe></div><a class="video-link" href="https://www.bilibili.com/video/BV1uhLb6zEeT" target="_blank" rel="noopener">经济学原理（中级）· 40集</a></div>'
    html += '<div class="video-card"><div class="video-frame"><iframe src="https://player.bilibili.com/player.html?bvid=BV1V8411V7kv&amp;page=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe></div><a class="video-link" href="https://www.bilibili.com/video/BV1V8411V7kv" target="_blank" rel="noopener">公共经济学</a></div>'
    html += '</div></div>'
  }

  html += '<div class="study-source"><span class="ss-tag am">来源</span><span>' + (day % 2 === 0 ? '数据来源：教材《马克思主义基本原理》《习近平新时代中国特色社会主义思想概论》 + 历年自考真题高频考点整理，仅供个人学习参考。' : '数据来源：教材《经济学原理（中级）》《公共经济学》 + 贵州历年自考真题高频考点 + B站课程（BV1uhLb6zEeT / BV1V8411V7kv）整理，仅供个人学习参考。') + '</span></div>'

  html += '</div>'
  return html
}

function getStudySection(sections, key) {

  }
  return { key: key, title: '', html: '' }

function toggleStructureNode(btn) {

  if (!node) return

var NODE_PLAYER = { btn: null, replayBtn: null, utter: null, highlightEl: null, node: null, segments: null, paused: false }

function initVoices() {
  if (typeof speechSynthesis === 'undefined') return
  try { speechSynthesis.getVoices() } catch (e) {}
}

function clearTtsHighlight() {
  if (NODE_PLAYER.highlightEl) {
    NODE_PLAYER.highlightEl.classList.remove('tts-highlight')
    NODE_PLAYER.highlightEl = null
  }
}

function resetPlayButton(btn) {
  if (!btn) return
  btn.classList.remove('playing', 'paused')
  btn.innerHTML = '🔊 播放'
}

function showReplayButton(btn, show) {
  if (!btn) return
  if (show) btn.classList.add('show')
  else btn.classList.remove('show')
}

function clearNodePlaybackState() {
  clearTtsHighlight()
  resetPlayButton(NODE_PLAYER.btn)
  showReplayButton(NODE_PLAYER.replayBtn, false)
  NODE_PLAYER.btn = null
  NODE_PLAYER.replayBtn = null
  NODE_PLAYER.utter = null
  NODE_PLAYER.node = null
  NODE_PLAYER.segments = null
  NODE_PLAYER.paused = false
}

function stopNodePlayback() {
  if (NODE_PLAYER.utter) {
    NODE_PLAYER.utter.onend = null
    NODE_PLAYER.utter.onerror = null
    NODE_PLAYER.utter.onboundary = null
  }
  if (typeof speechSynthesis !== 'undefined') {
    try { speechSynthesis.cancel() } catch (e) {}
  }
  clearNodePlaybackState()
}

function normalizeTtsText(s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim()
}

function splitSentences(text) {
  var s = normalizeTtsText(text)
  if (!s) return []
  var parts = s.match(/[^。！？!?]+[。！？!?]*/g)
  if (!parts) return [s]
  var out = []
  for (var i = 0; i < parts.length; i++) {
    var t = normalizeTtsText(parts[i])
    if (t) out.push(t)
  }
  return out.length ? out : [s]
}

function wrapParagraphSentences(el) {
  var existing = el.querySelectorAll('.tts-seg')
  if (existing && existing.length) return existing
  if (el.children && el.children.length) return null
  var sentences = splitSentences(el.textContent)
  if (sentences.length <= 1) return null
  el.textContent = ''
  var spans = []
  for (var i = 0; i < sentences.length; i++) {
    var sp = document.createElement('span')
    sp.className = 'tts-seg'
    sp.textContent = sentences[i]
    el.appendChild(sp)
    spans.push(sp)
  }
  return spans
}

function buildTtsSegments(node) {
  var segments = []
  var titleEl = node.querySelector('.structure-title')
  var body = node.querySelector('.structure-body')

  if (titleEl) {
    var tt = normalizeTtsText(titleEl.textContent)
    if (tt) segments.push({ el: titleEl, text: tt + '。' })
  }
  if (body) {
    var kids = body.children
    if (kids && kids.length) {
      for (var i = 0; i < kids.length; i++) {
        var child = kids[i]
        var spans = wrapParagraphSentences(child)
        if (spans && spans.length) {
          for (var j = 0; j < spans.length; j++) {
            var st = normalizeTtsText(spans[j].textContent)
            if (st) segments.push({ el: spans[j], text: st })
          }
        } else {
          var kt = normalizeTtsText(child.textContent)
          if (kt) segments.push({ el: child, text: kt })
        }
      }
    } else {
      var bt = normalizeTtsText(body.textContent)
      if (bt) segments.push({ el: body, text: bt })
    }
  }
  return segments
}

function highlightTtsSegment(segments, idx) {
  var target = null
  for (var i = segments.length - 1; i >= 0; i--) {
    if (idx >= segments[i].start) {
      target = segments[i]
      break
    }
  }
  if (!target) target = segments[0]
  if (!target) return
  if (NODE_PLAYER.highlightEl === target.el) return
  clearTtsHighlight()
  NODE_PLAYER.highlightEl = target.el
  target.el.classList.add('tts-highlight')
}

function openStructureNode(node) {
  if (!node) return
  node.classList.add('open')
  var t = node.querySelector('.structure-toggle')
  if (t) t.textContent = '收起'
}

function buildUtteranceForNode(node) {
  var segments = buildTtsSegments(node)
  if (!segments.length) return null

  var parts = []
  var offset = 0
  for (var i = 0; i < segments.length; i++) {
    segments[i].start = offset
    parts.push(segments[i].text)
    offset += segments[i].text.length + 1
  }
  var text = parts.join(' ')

  var utter = new SpeechSynthesisUtterance(text)
  utter.lang = 'zh-CN'
  utter.rate = 1
  utter.pitch = 1

  var voices = speechSynthesis.getVoices()
  for (var v = 0; v < voices.length; v++) {
    if (/zh|cmn|Chinese|中文/i.test(voices[v].lang + ' ' + voices[v].name)) {
      utter.voice = voices[v]
      break
    }
  }

  utter.onboundary = function(evt) {
    highlightTtsSegment(segments, evt.charIndex || 0)
  }
  utter.onend = function() { stopNodePlayback() }
  utter.onerror = function() { stopNodePlayback() }

  return { utter: utter, segments: segments }
}

function startNodePlayback(node, btn, replayBtn) {
  var built = buildUtteranceForNode(node)
  if (!built) {
    alert('该节点暂无文字内容。')
    return
  }

  openStructureNode(node)
  highlightTtsSegment(built.segments, 0)

  NODE_PLAYER.btn = btn
  NODE_PLAYER.replayBtn = replayBtn
  NODE_PLAYER.utter = built.utter
  NODE_PLAYER.node = node
  NODE_PLAYER.segments = built.segments
  NODE_PLAYER.paused = false

  btn.classList.remove('paused')
  btn.classList.add('playing')
  btn.innerHTML = '⏸ 暂停'
  showReplayButton(replayBtn, false)
  speechSynthesis.speak(built.utter)
}

function playNode(event, btn) {
  if (event && event.stopPropagation) event.stopPropagation()
  if (typeof speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') {
    alert('当前浏览器不支持语音播放，请使用 Chrome、Edge 或 Safari 浏览器。')
    return
  }
  var node = btn.closest ? btn.closest('.structure-node') : null
  if (!node) return

  var head = btn.parentElement
  var replayBtn = head ? head.querySelector('.structure-replay') : null

  if (NODE_PLAYER.btn === btn) {
    if (NODE_PLAYER.paused) {
      try { speechSynthesis.resume() } catch (e) {}
      NODE_PLAYER.paused = false
      btn.classList.remove('paused')
      btn.classList.add('playing')
      btn.innerHTML = '⏸ 暂停'
      showReplayButton(replayBtn, false)
    } else {
      try { speechSynthesis.pause() } catch (e) {}
      NODE_PLAYER.paused = true
      btn.classList.remove('playing')
      btn.classList.add('paused')
      btn.innerHTML = '▶ 继续'
      showReplayButton(replayBtn, true)
    }
    return
  }

  stopNodePlayback()
  startNodePlayback(node, btn, replayBtn)
}

function replayNode(event, btn) {
  if (event && event.stopPropagation) event.stopPropagation()
  if (typeof speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') {
    alert('当前浏览器不支持语音播放，请使用 Chrome、Edge 或 Safari 浏览器。')
    return
  }
  var node = btn.closest ? btn.closest('.structure-node') : null
  if (!node) return

  var head = btn.parentElement
  var playBtn = head ? head.querySelector('.structure-play:not(.structure-replay)') : null
  if (!playBtn) return

  stopNodePlayback()
  startNodePlayback(node, playBtn, btn)
}

function setupNodePlayback() {
  if (typeof speechSynthesis === 'undefined') return
  var nodes = document.querySelectorAll('.study-detail-content .structure-node')
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i]
    if (node.getAttribute('data-tts-ready')) continue
    node.setAttribute('data-tts-ready', '1')
    var head = node.querySelector('.structure-head')
    if (!head) continue
    var toggle = node.querySelector('.structure-toggle')
    var play = document.createElement('span')
    play.className = 'structure-play'
    play.innerHTML = '🔊 播放'
    play.setAttribute('role', 'button')
    play.onclick = function(e) { playNode(e, this) }

    var replay = document.createElement('span')
    replay.className = 'structure-play structure-replay'
    replay.innerHTML = '🔁 重复播放'
    replay.setAttribute('role', 'button')
    replay.onclick = function(e) { replayNode(e, this) }

    head.insertBefore(play, toggle || null)
    head.insertBefore(replay, toggle || null)
  }
}

function parseStudyDay(htmlText) {
  var doc = new DOMParser().parseFromString(htmlText, 'text/html')
  var title = ''
  var h1 = doc.querySelector('h1')
  if (h1) title = h1.textContent.trim()

  var sections = []
  var current = null
  var body = doc.body

  if (body) {
    var nodes = body.childNodes
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i]
      if (node.nodeType === 1 && node.tagName === 'H2') {
        var text = node.textContent.trim()
        var key = ''
        if (text.indexOf('上午') >= 0) key = 'am'
        else if (text.indexOf('下午') >= 0) key = 'pm'
        else if (text.indexOf('练习') >= 0) key = 'quiz'
        if (key) {
          current = { key: key, title: text, html: '' }
          sections.push(current)
        } else {
          current = null
        }
        continue
      }
      if (current && node.nodeType === 1) {
        current.html += node.outerHTML
      }
    }
  }

  return { title: title, sections: sections }
}

function getQuizHistory(day) {
  if (!DATA.study) DATA.study = { done: {}, quiz: {} }
  if (!DATA.study.quiz) DATA.study.quiz = {}
  if (!DATA.study.quiz[day]) DATA.study.quiz[day] = []
  return DATA.study.quiz[day]
}

function parseQuizQuestions(html) {
  var doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html')
  var container = doc.body.firstElementChild
  var questions = []
  if (!container) return questions

  var subject = ''
  var type = 'single'
  var typeLabel = '单项选择题'

  function classify(text) {
    if (text.indexOf('单项') >= 0) return { type: 'single', label: '单项选择题' }
    if (text.indexOf('多项') >= 0) return { type: 'multiple', label: '多项选择题' }
    if (text.indexOf('简答') >= 0) return { type: 'short', label: '简答题' }
    if (text.indexOf('计算') >= 0) return { type: 'calc', label: '计算题' }
    return { type: 'short', label: text }
  }

  var current = null
  var children = container.children
  for (var i = 0; i < children.length; i++) {
    var node = children[i]
    var tag = node.tagName

    if (tag === 'H3') {
      subject = node.textContent.replace(/^[一二三四五六七八九十]+[、.．]\s*/, '').replace(/练习题$/, '').trim()
    } else if (tag === 'H4') {
      var c = classify(node.textContent.trim())
      type = c.type
      typeLabel = c.label
    } else if (tag === 'HR') {
      if (current) { questions.push(current); current = null }
    } else if (tag === 'P') {
      var bold = node.querySelector('b')
      var boldText = bold ? bold.textContent.trim() : ''
      var text = node.textContent.trim()

      if (/^第\d+题/.test(boldText)) {
        if (current) { questions.push(current); current = null }
        var numMatch = boldText.match(/^第(\d+)题/)
        var num = numMatch ? parseInt(numMatch[1], 10) : 0
        var stem = node.textContent.replace(/^第\d+题\s*[:：]?\s*/, '').trim()
        current = {
          subject: subject,
          type: type,
          typeLabel: typeLabel,
          number: num,
          stem: stem,
          options: [],
          answer: '',
          explanation: '',
          inAnswer: false
        }
      } else if (current && boldText === '答案') {
        current.answer = node.textContent.replace(/^答案\s*[:：]\s*/, '').trim()
        current.inAnswer = true
      } else if (current && boldText === '解析') {
        current.inAnswer = false
        current.explanation = node.textContent.replace(/^解析\s*[:：]\s*/, '').trim()
      } else if (current && current.inAnswer) {
        current.answer += (current.answer ? '\n' : '') + text
      } else if (current && (current.type === 'single' || current.type === 'multiple')) {
        var optMatch = text.match(/^([A-F])[.、．]\s*/)
        if (optMatch) {
          current.options.push({ label: optMatch[1], text: text.replace(/^[A-F][.、．]\s*/, '') })
        } else {
          current.stem += (current.stem ? '\n' : '') + text
        }
      } else if (current) {
        current.stem += (current.stem ? '\n' : '') + text
      }
    }
  }
  if (current) questions.push(current)

  return questions
}

function buildQuizGroups(questions) {
  var groups = []
  var map = {}
  for (var i = 0; i < questions.length; i++) {
    var subj = questions[i].subject || '其他'
    if (!map[subj]) {
      map[subj] = { subject: subj, indices: [] }
      groups.push(map[subj])
    }
    map[subj].indices.push(i)
  }
  return groups
}

function displaySubject(s) {
  return (s || '').replace(/练习题$/, '')
}

function ensureQuizState(day, sec) {
  if (STUDY_SELECTED && STUDY_SELECTED.quiz && STUDY_SELECTED.quiz.day === day && STUDY_SELECTED.quiz.questions) {
    return STUDY_SELECTED.quiz
  }
  var questions = parseQuizQuestions(sec.html || '')
  var order = []
  for (var i = 0; i < questions.length; i++) order.push(i)
  STUDY_SELECTED.quiz = {
    day: day,
    questions: questions,
    order: order,
    groups: buildQuizGroups(questions),
    current: 0,
    answers: {},
    submitted: false,
    results: {}
  }
  return STUDY_SELECTED.quiz
}

function normalizeAnswer(s) {
  return String(s == null ? '' : s).replace(/[、，,.\s]/g, '').toUpperCase()
}

function parseAnswerLetters(s) {
  var str = normalizeAnswer(s)
  var out = []
  for (var i = 0; i < str.length; i++) {
    var ch = str.charAt(i)
    if (ch >= 'A' && ch <= 'Z') out.push(ch)
  }
  return out
}

function sameSet(a, b) {
  if (a.length !== b.length) return false
  var sa = a.slice().sort().join('')
  var sb = b.slice().sort().join('')
  return sa === sb
}

function formatTime(ts) {
  var d = new Date(ts)
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')
}

function renderQuizPanel(day, sec) {
  var q = ensureQuizState(day, sec)
  return renderQuizPanelContent(day, q)
}

function renderQuizPanelContent(day, q) {
  var html = '<div class="quiz-wrap">'

  if (!q.questions.length) {
    html += '<div class="empty-state">本日练习题暂未解析到题目，请打开练习册查看。</div>'
    html += '</div>'
    return html
  }

  html += '<div class="quiz-layout">'

  html += '<div class="quiz-main">'
  html += renderQuizQuestionView(q)
  html += renderQuizControls(q)
  html += '</div>'

  html += '<div class="quiz-nav">'
  html += renderQuizNavigator(q)
  html += '</div>'

  html += '</div>'

  html += renderQuizHistory(day)

  html += '</div>'
  return html
}

function renderQuizQuestionView(q) {
  var qi = q.order[q.current]
  var question = q.questions[qi]
  var result = q.submitted ? q.results[qi] : null
  var cardCls = 'quiz-question'
  if (q.submitted) {
    if (result === true) cardCls += ' q-correct'
    else if (result === false) cardCls += ' q-wrong'
  }

  var html = '<div class="' + cardCls + '">'

  html += '<div class="quiz-q-head">'
  html += '<span class="quiz-q-num">第' + question.number + '题</span>'
  html += '<span class="quiz-q-type">' + escapeHtml(question.typeLabel) + '</span>'
  html += '<span class="quiz-q-subject">' + escapeHtml(displaySubject(question.subject)) + '</span>'
  html += '</div>'

  html += '<div class="quiz-q-stem">' + escapeHtml(question.stem) + '</div>'

  if (question.type === 'single') {
    html += '<div class="quiz-options">'
    var val = q.answers[qi]
    for (var o = 0; o < question.options.length; o++) {
      var opt = question.options[o]
      var checked = (val === opt.label) ? ' checked' : ''
      html += '<label class="quiz-option"><input type="radio" name="quiz-opt-' + qi + '" value="' + opt.label + '"' + checked + (q.submitted ? ' disabled' : '') + ' onchange="quizSetAnswer(' + qi + ', this.value)"><span>' + opt.label + '. ' + escapeHtml(opt.text) + '</span></label>'
    }
    html += '</div>'
  } else if (question.type === 'multiple') {
    html += '<div class="quiz-options">'
    var arr = (q.answers[qi] && q.answers[qi].constructor === Array) ? q.answers[qi] : []
    for (var o2 = 0; o2 < question.options.length; o2++) {
      var opt2 = question.options[o2]
      var checked = (arr.indexOf(opt2.label) >= 0) ? ' checked' : ''
      html += '<label class="quiz-option"><input type="checkbox" name="quiz-opt-' + qi + '" value="' + opt2.label + '"' + checked + (q.submitted ? ' disabled' : '') + ' onchange="quizToggleAnswer(' + qi + ', this.value, this.checked)"><span>' + opt2.label + '. ' + escapeHtml(opt2.text) + '</span></label>'
    }
    html += '</div>'
  } else {
    html += '<textarea class="quiz-textarea" id="quiz-text-' + qi + '" rows="6" placeholder="请在此输入你的答案…"' + (q.submitted ? ' disabled' : '') + ' oninput="quizSetAnswer(' + qi + ', this.value)">' + escapeHtml(q.answers[qi] || '') + '</textarea>'
  }

  if (q.submitted) {
    html += renderQuizFeedback(question, result, qi)
  }

  html += '</div>'
  return html
}

function renderQuizControls(q) {
  var html = '<div class="quiz-controls">'
  html += '<button class="quiz-btn" onclick="quizPrev()"' + (q.current === 0 ? ' disabled' : '') + '>上一题</button>'
  html += '<button class="quiz-btn" onclick="quizNext()"' + (q.current >= q.order.length - 1 ? ' disabled' : '') + '>下一题</button>'
  if (!q.submitted) {
    html += '<button class="quiz-btn primary" onclick="submitQuiz()">提交</button>'
  } else {
    html += '<button class="quiz-btn primary" onclick="reshuffleQuiz()">打乱重做</button>'
  }
  html += '</div>'
  return html
}

function renderQuizNavigator(q) {
  var html = '<div class="quiz-nav-title">题目导航</div>'
  for (var g = 0; g < q.groups.length; g++) {
    var group = q.groups[g]
    html += '<div class="quiz-nav-subject">' + escapeHtml(displaySubject(group.subject)) + '</div>'
    html += '<div class="quiz-nav-grid">'
    for (var k = 0; k < group.indices.length; k++) {
      var qi = group.indices[k]
      var question = q.questions[qi]
      var isCurrent = (q.order[q.current] === qi)
      var cls = 'quiz-nav-num'
      if (isCurrent) cls += ' current'
      if (q.submitted) {
        var r = q.results[qi]
        if (r === true) cls += ' correct'
        else if (r === false) cls += ' wrong'
      }
      html += '<button class="' + cls + '" onclick="quizJumpTo(' + qi + ')">' + question.number + '</button>'
    }
    html += '</div>'
  }
  return html
}

function renderQuizFeedback(question, result, qi) {
  var html = '<div class="quiz-result">'
  if (question.type === 'single' || question.type === 'multiple') {
    if (result === true) html += '<div class="quiz-feedback correct">✓ 回答正确</div>'
    else if (result === false) html += '<div class="quiz-feedback wrong">✗ 回答错误</div>'
    html += '<div class="quiz-answer"><b>正确答案：</b>' + escapeHtml(question.answer) + '</div>'
  } else {
    html += '<div class="quiz-answer"><b>参考答案：</b></div>'
    html += '<div class="quiz-ref-answer">' + escapeHtml(question.answer) + '</div>'
    html += '<div class="quiz-selfmark"><span>自我评价：</span>'
    html += '<button class="mini-btn' + (result === true ? ' self-on' : '') + '" onclick="selfMarkQuiz(' + qi + ', true)">✓ 答对了</button>'
    html += '<button class="mini-btn' + (result === false ? ' self-on danger' : '') + '" onclick="selfMarkQuiz(' + qi + ', false)">✗ 答错了</button>'
    html += '</div>'
  }
  if (question.explanation) {
    html += '<div class="quiz-explain"><b>解析：</b>' + escapeHtml(question.explanation) + '</div>'
  }
  html += '</div>'
  return html
}

function renderQuizPanelLive() {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  var panel = document.getElementById('studyPanel-quiz')
  if (!panel) return
  var titleEl = panel.querySelector('.study-panel-title')
  var titleHtml = titleEl ? titleEl.outerHTML : ''
  panel.innerHTML = titleHtml + renderQuizPanelContent(STUDY_SELECTED.day, q)
}

function quizPrev() {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  if (q.current > 0) { q.current--; renderQuizPanelLive() }
}

function quizNext() {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  if (q.current < q.order.length - 1) { q.current++; renderQuizPanelLive() }
}

function quizJumpTo(qi) {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  var pos = q.order.indexOf(qi)
  if (pos >= 0) { q.current = pos; renderQuizPanelLive() }
}

function quizSetAnswer(qi, value) {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  q.answers[qi] = value
}

function quizToggleAnswer(qi, value, checked) {
  var q = STUDY_SELECTED && STUDY_SELECTED.quiz
  if (!q) return
  var arr = q.answers[qi]
  if (!arr || arr.constructor !== Array) arr = []
  if (checked) {
    if (arr.indexOf(value) < 0) arr.push(value)
  } else {
    var idx = arr.indexOf(value)
    if (idx >= 0) arr.splice(idx, 1)
  }
  q.answers[qi] = arr
}

function renderQuizHistory(day) {
  var history = getQuizHistory(day)
  var total = (STUDY_SELECTED && STUDY_SELECTED.quiz && STUDY_SELECTED.quiz.questions) ? STUDY_SELECTED.quiz.questions.length : 0
  var html = '<div class="quiz-history">'
  html += '<div class="quiz-history-title">答题记录 · 已做 ' + history.length + ' 次</div>'
  if (!history.length) {
    html += '<div class="quiz-history-empty">还没有答题记录。完成一次提交后，这里会显示每一次的题目对错情况。</div>'
  } else {
    for (var a = history.length - 1; a >= 0; a--) {
      var att = history[a]
      html += '<div class="quiz-attempt">'
      html += '<div class="quiz-attempt-head">第 ' + (a + 1) + ' 次 · ' + formatTime(att.time) + '</div>'
      html += '<div class="quiz-attempt-grid">'
      for (var i = 0; i < total; i++) {
        var r = att.results ? att.results[i] : null
        var cls = 'pending'
        var label = String(i + 1)
        var tip = '第' + (i + 1) + '题：未标记'
        if (r === true) { cls = 'correct'; label = '✓'; tip = '第' + (i + 1) + '题：答对' }
        else if (r === false) { cls = 'wrong'; label = '✗'; tip = '第' + (i + 1) + '题：答错' }
        html += '<span class="quiz-dot ' + cls + '" title="' + tip + '">' + label + '</span>'
      }
      html += '</div>'
      html += '<div class="quiz-attempt-summary">' + summarizeAttempt(att, total) + '</div>'
      html += '</div>'
    }
  }
  html += '</div>'
  return html
}

function summarizeAttempt(att, total) {
  var right = 0, wrong = 0, pending = 0
  var results = att.results || {}
  for (var i = 0; i < total; i++) {
    var r = results[i]
    if (r === true) right++
    else if (r === false) wrong++
    else pending++
  }
  return '答对 ' + right + ' 题 · 答错 ' + wrong + ' 题' + (pending ? ' · 待自评 ' + pending + ' 题' : '')
}

function submitQuiz() {
  if (!STUDY_SELECTED || !STUDY_SELECTED.quiz) return
  var q = STUDY_SELECTED.quiz
  if (q.submitted) return

  var results = {}
  for (var i = 0; i < q.questions.length; i++) {
    var question = q.questions[i]
    if (question.type === 'single') {
      results[i] = (normalizeAnswer(q.answers[i]) === normalizeAnswer(question.answer))
    } else if (question.type === 'multiple') {
      var arr = (q.answers[i] && q.answers[i].constructor === Array) ? q.answers[i] : []
      results[i] = sameSet(arr, parseAnswerLetters(question.answer))
    } else {
      results[i] = null
    }
  }

  q.submitted = true
  q.results = results

  var history = getQuizHistory(STUDY_SELECTED.day)
  history.push({ time: Date.now(), results: results })
  saveData()
  renderQuizPanelLive()
}

function reshuffleQuiz() {
  if (!STUDY_SELECTED || !STUDY_SELECTED.quiz) return
  var q = STUDY_SELECTED.quiz
  q.order = shuffle(q.order)
  q.current = 0
  q.answers = {}
  q.submitted = false
  q.results = {}
  renderQuizPanelLive()
}

function selfMarkQuiz(qi, correct) {
  if (!STUDY_SELECTED || !STUDY_SELECTED.quiz) return
  var day = STUDY_SELECTED.day
  var history = getQuizHistory(day)
  if (!history.length) return
  var attempt = history[history.length - 1]
  if (!attempt.results) attempt.results = {}
  attempt.results[qi] = correct
  if (STUDY_SELECTED.quiz.results) STUDY_SELECTED.quiz.results[qi] = correct
  saveData()
  renderQuizPanelLive()
}

function renderDesign() {
  renderList('designProjects', 'design.project', DATA.design.projects, function(it) {
    return '<div class="item-title">' + escapeHtml(it.name || '未命名项目') + '</div><div class="item-sub">' + escapeHtml(it.status || '') + (it.progress ? ' · 进度 ' + escapeHtml(it.progress) + '%' : '') + '</div>'
  })
  renderList('designTodos', 'design.todo', DATA.design.todos, function(it) {
    var done = it.done === '1' || it.done === true
    return '<div class="item-title" style="' + (done ? 'text-decoration:line-through;color:var(--dim);' : '') + '">' + escapeHtml(it.text || '') + '</div><div class="item-sub">' + (done ? '已完成' : '未完成') + '</div>'
  })
}

function renderStock() {
  renderList('stockHoldings', 'stock.holding', DATA.stock.holdings, function(it) {
    return '<div class="item-title">' + escapeHtml(it.name || '') + ' <span style="color:var(--dim);font-size:11px;">' + escapeHtml(it.code || '') + '</span></div><div class="item-sub">' + escapeHtml(it.shares || 0) + ' 股 · 成本 ' + escapeHtml(it.cost || 0) + '</div>'
  })
  renderList('stockWatch', 'stock.watch', DATA.stock.watch, function(it) {
    return '<div class="item-title">' + escapeHtml(it.name || '') + ' <span style="color:var(--dim);font-size:11px;">' + escapeHtml(it.code || '') + '</span></div><div class="item-sub">现价 ' + escapeHtml(it.price || 0) + ' · ' + (TAG_MAP[it.signal] || it.signal || '') + '</div>'
  })
}

function renderBiz() {
  var inc = DATA.biz.income || { month: 0, goal: 0, total: 0 }
  document.getElementById('bizIncome').innerHTML =
    '<div class="income-card"><div class="income-label">本月收入</div><div class="income-value">¥' + (inc.month || 0) + '</div></div>' +
    '<div class="income-card"><div class="income-label">目标收入</div><div class="income-value">¥' + (inc.goal || 0) + '</div></div>' +
    '<div class="income-card"><div class="income-label">累计收入</div><div class="income-value">¥' + (inc.total || 0) + '</div></div>'

  renderList('bizNews', 'biz.news', DATA.biz.news, function(it) {
    var tag = it.tag || ''
    var tagText = TAG_MAP[tag] || tag || ''
    var text = escapeHtml(it.text || '')
    var linkHtml = ''
    if (it.link && (it.link.indexOf('http://') === 0 || it.link.indexOf('https://') === 0)) {
      linkHtml = '<a class="news-link" href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>'
    } else {
      linkHtml = '<span class="news-link" style="display:block;">' + text + '</span>'
    }
    return '<span class="news-tag news-tag-' + escapeHtml(tag) + '">' + escapeHtml(tagText) + '</span>' + linkHtml
  })
  renderList('bizOrders', 'biz.order', DATA.biz.orders, function(it) {
    return '<div class="item-title">' + escapeHtml(it.name || '') + '</div><div class="item-sub">' + (it.amount ? '¥' + escapeHtml(it.amount) : '') + ' · ' + escapeHtml(it.status || '') + '</div>'
  })
  renderList('bizProjects', 'biz.project', DATA.biz.projects, function(it) {
    return '<div class="item-title">' + escapeHtml(it.name || '') + '</div><div class="item-sub">' + escapeHtml(it.status || '') + '</div>'
  })
}

function renderList(containerId, type, list, itemHtmlFn) {
  var el = document.getElementById(containerId)
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无数据，点击上方按钮添加</div>'
    return
  }
  var html = ''
  for (var i = 0; i < list.length; i++) {
    var it = list[i]
    html += '<div class="item-row">'
    html += '<div class="item-main">' + itemHtmlFn(it) + '</div>'
    html += '<div class="item-actions">'
    html += '<button class="mini-btn" onclick="openEditModal(\'' + type + '\',\'' + it.id + '\')">编辑</button>'
    html += '<button class="mini-btn danger" onclick="deleteItem(\'' + type + '\',\'' + it.id + '\')">删除</button>'
    html += '</div></div>'
  }
  el.innerHTML = html
}

renderAll()
initVoices()
if (typeof speechSynthesis !== 'undefined') {
  try { speechSynthesis.onvoiceschanged = initVoices } catch (e) {}
}
